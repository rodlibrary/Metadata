name: Weekly ScholarWorks metadata snapshot

on:
  schedule:
    # Mondays at 11:00 UTC (6:00 AM Central during daylight time, 5:00 AM in winter)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed to commit the new CSV

concurrency:
  group: scholarworks-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scholarworks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest OAI-PMH metadata
        run: python harvest.py --prefix oai_dc --out-dir snapshots --keep 4

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly ScholarWorks metadata snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
