name: Weekly ArchivesSpace metadata snapshot

on:
  schedule:
    # Mondays at 12:00 UTC (7:00 AM Central during daylight time, 6:00 AM in winter)
    - cron: "0 12 * * 1"
  workflow_dispatch:      # lets you run it by hand from the Actions tab
    inputs:
      max_records:
        description: "Test run: harvest only this many records, save the CSV as a run artifact, commit nothing (blank = full harvest)"
        type: string
        default: ""

permissions:
  contents: write         # needed to commit the new CSV

concurrency:
  group: ${{ github.workflow }}   # one run per collection at a time; other collections run in parallel
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # two passes: oai_mods (~1.5 h), then oai_dc for links, call numbers and dates
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest OAI-PMH metadata
        run: >
          python scripts/oai_harvest.py
          --name archivesspace
          --base-url https://aspace.library.uni.edu:8082
          --prefix oai_mods
          --merge-prefix oai_dc
          --merge-fields "^(identifier|date|publisher)$"
          --out-dir archivesspace/snapshots
          --keep 4
          ${{ inputs.max_records && format('--max-records {0}', inputs.max_records) || '' }}

      - name: Save test-run CSV
        if: inputs.max_records != ''
        uses: actions/upload-artifact@v4
        with:
          name: archivesspace-test-${{ github.run_number }}
          path: archivesspace/snapshots/latest_oai_mods.csv

      - name: Commit snapshot
        if: inputs.max_records == ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A archivesspace/snapshots/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly ArchivesSpace metadata snapshot $(date -u +%Y-%m-%d)"
            # other collections may push at the same time: rebase and retry
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              echo "Push attempt $i failed; retrying in 15s"; sleep 15
              [ "$i" = 5 ] && exit 1
            done
          fi
