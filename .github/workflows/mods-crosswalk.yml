name: MODS crosswalk

# Runs after each weekly harvest finishes (and on demand from the Actions tab).
# Maps the latest snapshots to MODS, commits the MODS CSVs in mods/, and saves the
# MODS XML and Solr JSON as a downloadable run artifact. If a Solr core is configured,
# it also indexes the records for Blacklight.
on:
  workflow_run:
    workflows:
      - Weekly ScholarWorks metadata snapshot
      - Weekly ArchivesSpace metadata snapshot
      - Weekly Preservica metadata snapshot
      - Weekly MuseumPlus metadata snapshot
      - Weekly Archive-It metadata snapshot
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: "One source only (scholarworks, archivesspace, preservica, museumplus, archiveit); blank = all"
        type: string
        default: ""
      validate:
        description: "Validate every record against the MODS 3.8 schema"
        type: boolean
        default: true

permissions:
  contents: write         # needed to commit the MODS CSVs

concurrency:
  group: mods-crosswalk   # harvests finish at different times; run one crosswalk at a time, in order
  cancel-in-progress: false

# Optional: index into Solr for Blacklight. Settings -> Secrets and variables -> Actions:
#   Variable: SOLR_URL   the core's URL, e.g. https://solr.library.uni.edu/solr/blacklight-core
#                        (it must be reachable from GitHub's runners). Leave unset to skip indexing.
env:
  SOLR_URL: ${{ vars.SOLR_URL }}

jobs:
  crosswalk:
    # after a harvest, only run if it succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}   # include the snapshot the harvest just committed

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Map snapshots to MODS
        run: |
          args="--xml --solr-json"
          if [ -n "${{ inputs.source }}" ]; then args="$args --source ${{ inputs.source }}"; fi
          # validate on manual runs when ticked, and always on harvest-triggered runs
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.validate }}" = "true" ]; then
            args="$args --validate"
          fi
          if [ -n "$SOLR_URL" ]; then args="$args --solr-url $SOLR_URL"; fi
          python scripts/mods_crosswalk.py $args

      - name: Save MODS XML and Solr JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mods-${{ github.run_number }}
          path: build/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit MODS CSVs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A mods/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "MODS crosswalk $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && break
              echo "Push attempt $i failed; retrying in 15s"; sleep 15
              [ "$i" = 5 ] && exit 1
            done
          fi
